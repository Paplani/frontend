        border-radius: 10px 40px;
        padding: 10px;
      }
      ul > li:not(:last-child) {
        border-bottom: 1px solid black;
      }
      div {
        width: 300px;
        height: 300px;
        background-color: blueviolet;
        border-radius: 50%;
      }

  </head>
