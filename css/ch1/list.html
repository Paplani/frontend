<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      ul {
        list-style: circle;
        /* list-style-type: disc; */
        list-style-position: inside;
        /* list-style-image: none; */
      }
      ul > li:first-child {
        list-style: "(●'◡'●)";
        list-style-position: inside;
      }
      ol {
        list-style: upper-roman;
      }
    </style>
  </head>
  <body>
    <!-- 리스트 스타일
         list-style : 한꺼번에 주는 방식
         
         개별로 주는 방식
         list-style-type
         list-style-position: inside;
         list-style-image

         ul : disc(기본), circle, square
         ol : alpha, roman, decimal(기본)
    -->
    <ul>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
    </ul>
    <ol>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
      <li>리스트 아이템1</li>
    </ol>
  </body>
</html>
