<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      div {
        width: 100px;
        height: 100px;
        background: tomato;
        padding: 20px;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <!-- 요소의 크기 
        content(width, height) + padding + border 

        box-sizing : border-box;   => 다 포함한 값 안에서 padding, border가 정해짐

        content-box : w,h 크기는 content만 적용
    -->
    <div></div>
  </body>
</html>
