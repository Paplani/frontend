<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* grand-parent : w 800 , h 500, border 2px dashed */
      /* parent : w 500, h 400, border 2px dashed */
      /* child : w100m,  h100, border 1px solid black */
      * {
        box-sizing: border-box;
      }
      body {
        height: 4000px;
      }
      .grand-parent {
        width: 800px;
        height: 500px;
        border: 2px dashed pink;
      }
      .grand-parent > .parent {
        width: 500px;
        height: 400px;
        border: 2px dashed blue;
      }
      .child {
        width: 100px;
        height: 100px;
        border: 1px solid black;
        background-color: orange;
      }
      .fixed {
        position: fixed;
        right: 100px;
        bottom: 100px;
      }
    </style>
  </head>
  <body>
    <div class="grand-parent">
      <div class="parent">
        <div class="child">1</div>
        <div class="child fixed">2</div>
        <div class="child">3</div>
      </div>
    </div>
  </body>
</html>
