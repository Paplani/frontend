<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 선택자
        1) 태그 선택자 
        2) 아이디 선택자
        3) 클래스 선택자
        4) 전체 선택자 : *
        5) 자손 선택자 : 공백
        6) 자식 선택자 : >
        7) 인접형제 선택자 : + or ~ (뒤에 따라나오는 첫번째 요소만) or (뒤에 따라나오는 모든 요소)
        8) 그룹화
        */
      div * {
        /* background-color: darksalmon; */
        color: orange;
      }
      nav #title2 {
        color: brown;
      }
      .color {
        color: blue;
      }
      .line {
        text-decoration: underline;
      }
      .weight {
        font-weight: bold;
      }
      .color {
        color: aquamarine;
      }
      #container > ul {
        border: 2px dotted blue;
      }
      div h1 + h2 {
        color: red;
      }
    </style>
  </head>
  <body>
    <div>
      <!-- 전역속성 : id, class -->
      <h1 id="title">css 선택자</h1>
      <h2>형제 선택자</h2>
      <h2>형제 선택자2</h2>
    </div>
    <ul>
      <li class="color">List Item1</li>
      <li class="color line">List Item2</li>
      <li class="color line weight">List Item3</li>
    </ul>
    <nav>
      <h1 id="title2">css 선택자</h1>
      <h1>css 선택자2</h1>
    </nav>
    <section id="container">
      <header>
        <h1>예약 방법 및 요금</h1>
      </header>
      <p>요안도라에 예약하려면?</p>
      <ul>
        <li>
          예약방법
          <ul>
            <li>직접 통화</li>
            <li>문자 남기기</li>
          </ul>
        </li>
        <li>
          요금
          <ul>
            <li>1인 : 40,000원</li>
            <li>2인 : 80,000원</li>
            <li>3인 : 120,000원</li>
            <li>4인 : 160,000원</li>
          </ul>
        </li>
      </ul>
    </section>
  </body>
</html>
