<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 선택자
        1) 태그 선택자 
        2) 아이디 선택자
        3) 클래스 선택자
        4) 전체 선택자 : *
        5) 자손 선택자 : 공백
        6) 자식 선택자 : >
        7) 인접형제 선택자 : + or ~ (뒤에 따라나오는 첫번째 요소만) or (뒤에 따라나오는 모든 요소)
        8) 그룹화
        9) 속성 선택자 : [class=''], [id=''], [속성명^=값] : 값으로 시작하는
            [속성명$=값] : 값으로 끝나는
            [속성명~=값] : 값이 포함된
        10) 가상 클래스 선택자
        a : 밑줄, 파란색을 기본값으로 가지고 있음
            active 하면 빨강색으로 됨
            visited 하면 보라색으로 

        :hover : 요소에 마우스 올려놓았을 때
        :checked, :disabled

        11) 가상 요소 선택자
            ::after, ::before
        12) 구조 선택자
            :first-child, :last-child, :nth-child()
            :first-of-type, :last-of-type, :nth-of-type
        13) not(선택자) : 해당 선택자가 아닌
        */

      #title,
      nav #title2 {
        color: brown;
      }
      #title:hover {
        background-color: orange;
      }
      /* [href] {
        color: red;
      } */
      /* a[target="_blank"] {
        color: red;
      }
      [class$="name"] {
        background-color: aqua;
      }
      [class~="line"] {
        background-color: blueviolet;
      } */
      a:link {
        text-decoration: none;
        color: black;
      }
      a:visited {
        color: black;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: aquamarine;
      }
      .box:hover {
        width: 200px;
      }
    </style>
  </head>
  <body>
    <div>
      <!-- 전역속성 : id, class -->
      <h1 id="title">css 선택자</h1>
      <h2 class="fruit_name">형제 선택자</h2>
      <h2>형제 선택자2</h2>
    </div>
    <div class="box"></div>
    <ul>
      <li class="color">List Item1</li>
      <li class="color line">List Item2</li>
      <li class="color line weight">List Item3</li>
    </ul>
    <nav>
      <h1 id="title2">css 선택자</h1>
      <h1>css 선택자2</h1>
    </nav>
    <ul>
      <li><a href="http://www.naver.com">네이버</a></li>
      <li><a href="http://www.daum.com" target="_blank">다음</a></li>
    </ul>
  </body>
</html>
