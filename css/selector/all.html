<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 선택자
        1) 태그 선택자 
        2) 아이디 선택자
        3) 클래스 선택자
        4) 전체 선택자 : *
        5) 자손 선택자 : 공백
        6) 자식 선택자 : >
        */
      div * {
        /* background-color: darksalmon; */
        color: orange;
      }
      .color {
        color: blue;
      }
      .line {
        text-decoration: underline;
      }
      .weight {
        font-weight: bold;
      }
      .color {
        color: aquamarine;
      }
    </style>
  </head>
  <body>
    <div>
      <!-- 전역속성 : id, class -->
      <h1 id="title">css 선택자</h1>
      <h1>css 선택자2</h1>
    </div>
    <ul>
      <li class="color">List Item1</li>
      <li class="color line">List Item2</li>
      <li class="color line weight">List Item3</li>
    </ul>
  </body>
</html>
