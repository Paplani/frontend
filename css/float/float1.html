<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .red,
      .blue,
      .green {
        margin: 0.5em;
        height: 160px;
        text-align: center;
        border-radius: 4px;
        color: white;
      }
      .blue {
        width: 160px;
        background-color: slateblue;
        float: left;
      }
      .red {
        width: 240px;
        height: 240px;
        background-color: tomato;
        float: right;
      }
      .green {
        width: 160px;
        background-color: olivedrab;
        float: right;
      }

      .gray {
        padding: 0.8em;
        background-color: #eee;
        clear: both;
      }
    </style>
  </head>
  <body>
    <div class="result">
      <h1>float 와 clear 속성</h1>
      <div class="blue">파랑</div>
      <div class="red">빨강 div</div>
      <span class="green">초록 span</span>
    </div>
    <div class="gray">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Harum sed totam, tenetur delectus sunt itaque vitae modi.
      Reiciendis, incidunt culpa sed omnis laudantium fugiat alias, nesciunt eum, laboriosam ducimus ullam.
    </div>
  </body>
</html>
