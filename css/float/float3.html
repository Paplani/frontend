<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        background-color: white;
        width: 100%;
        height: 100%;
      }
      .box img:first-child {
        float: left;
      }
      .box img:nth-child(2) {
        float: right;
      }
      p {
        clear: both;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="../data/left-arrow.png" alt="" />
      <img src="../data/right-arrow.png" alt="" />
      <p>
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Dolore repellendus, accusantium ratione id dolorem
        fugit labore voluptatibus blanditiis iure quisquam saepe at. Labore, soluta ipsam quo molestias nam nesciunt
        eos?
      </p>
    </div>
  </body>
</html>
