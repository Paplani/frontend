<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div></div>
    <script>
      async function load() {
        const response = await fetch("https://jsonplaceholder.typicode.com/users1");
        const data = await response.json();
        console.log(data);
        console.log(data.userId);

        let result = `<ul>`;

        data.forEach((item) => {
          result += `<li>id : ${item.id}</li>`;
          result += `<li>name : ${item.name}</li>`;
          result += `<li>username : ${item.username}</li>`;
          result += `<li>address : ${item.address.city}</li>`;
        });
        result += `</ul>`;
        document.querySelector("div").innerHTML = result;
      }

      //   div 안에 도착한 데이터 보여주기
      load();
    </script>
  </body>
</html>
