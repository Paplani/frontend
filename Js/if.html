<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      // 브라우저에서 제공하는 함수
      //   숫자형으로 변경 : parseInt() : 정수형으로 만듬, Number() : 실수로 만들어줌
      const num = parseInt(prompt("숫자입력"));
      console.log(num);
      console.log(typeof num);

      console.log(num > 0 ? "양수" : "음수");
    </script>
  </head>
  <body></body>
</html>
