<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div * {
        padding: 10px;
        margin: 10px;
      }
      [read-only] {
        background-color: lightgray;
      }
    </style>
  </head>
  <body>
    <h2>숫자 맞추기</h2>
    <p>컴퓨터가 생성한 숫자를 맞추는 게임입니다<br />숫자는 1 ~ 100 사이에 있습니다.</p>
    <div>
      <label for="num1">숫자</label>
      <input type="text" name="num1" id="num1" size="5" />
      <button type="button">확인</button>
    </div>
    <div>
      <label for="count">추측횟수</label>
      <input type="text" name="count" id="count" size="5" readonly />
    </div>
    <div>
      <label for="count">힌트</label>
      <input type="text" name="hint" id="hint" readonly />
    </div>

    <script>
      // 1 ~ 100 난수 하나 생성
      //   확인 누를때마다 추측횟수 증가후 보여주기
      // 힌트 : 추측값이 작다, 크다, 정답입니다!
      // 정답을 맞추면 확인버튼 비활성화

      const num = Math.floor(Math.random() * 100) + 1;
      const inputnum = document.querySelector("#num1");
      const guess = document.querySelector("#count");
      const hint = document.querySelector("#hint");
      const btn = document.querySelector("button");

      let order = 0;

      btn.addEventListener("click", (e) => {
        // if (e.target.tagName !== "BUTTON") return;

        const inputvalue = parseInt(Number(inputnum.value));

        // 숫자 입력받은게 아닐시 코드
        if (Number.isNaN(inputvalue)) {
          hint.value = "숫자를 입력하세요.";
          return;
        }
        // 1 ~ 100 사이가 아닌 수를 입력할때의 코드
        if (inputvalue > 100 || inputvalue < 1) {
          hint.value = "1 ~ 100 사이의 수를 입력하세요.";
          return;
        }

        order += 1;
        guess.value = `${order}회`;

        if (inputvalue < num) {
          hint.value = "추측값이 작아요.";
        }
        if (inputvalue > num) {
          hint.value = "추측값이 커요";
        }
        if (inputvalue === num) {
          // hint는 input 이기때문에 hint.value 사용!
          hint.value = "정답입니다.";
          e.target.disabled = true;
        }
      });
    </script>
  </body>
</html>
